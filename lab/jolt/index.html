<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Jolt arañas y gusanos</title>
<style>
:root{--bg:#0d0e10;--fg:#e8e8ea;--mut:#9a9ca3;--ac:#ff754a}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif;overflow:hidden}
#ui{position:fixed;left:12px;top:12px;max-width:min(360px,calc(100vw - 24px));background:#000a;padding:10px 12px;border-radius:8px}
#ui h1{font-size:15px;margin:0 0 6px} #ui p{margin:4px 0;color:var(--mut)} button{margin:3px 4px 3px 0;background:#222;color:var(--fg);border:1px solid #444;border-radius:5px;padding:5px 9px;cursor:pointer}
button.on{border-color:var(--ac);color:var(--ac)} #st{font-variant-numeric:tabular-nums;color:var(--fg)} label{color:var(--mut)}
canvas{display:block}
</style>
</head>
<body>
<div id="ui">
<h1>Jolt · cuerpo activo (M4)</h1>
<p>La marcha es la procedural; Jolt entra solo al golpear. Clic: golpe en ese punto (hit), en la dirección de la cámara. Mayús+clic: matar. Arrastra para girar.</p>
<div><button id="b-uno" class="on">1 araña + 1 gusano</button><button id="b-fren">Frenesí 20+5</button><button id="b-lod" class="on">Solo golpeadas</button></div>
<div><button id="b-parry">Parry al más cercano</button><button id="b-matar">Matar todos</button><button id="b-pata">Romper pata</button><button id="b-morder">Morder</button><button id="b-rev">Reiniciar</button></div>
<div><label>Impulso <input id="imp" type="range" min="5" max="80" value="20"> <span id="impv">20</span> N·s</label></div>
<p id="st"></p>
</div>
<script type="module" src="./main.ts"></script>
</body>
</html>
